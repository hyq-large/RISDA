[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risda"
version = "0.2.0"
description = "RISDA inference with PPGF and VCLG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch==2.5.1", "xformers==0.0.28.post3",
  "numpy>=1.26,<2", "pandas>=2.2,<3",
  "xarray>=2024.6,<2026", "h5netcdf>=1.3,<2",
  "einops>=0.8,<0.9", "omegaconf==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.4,<1", "build>=1,<2"]

[project.scripts]
risda = "risda.run:main"

[tool.setuptools.packages.find]
include = ["appa*", "risda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/risda" = ["configs/assimilation.yaml", "configs/paths.env.example"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
