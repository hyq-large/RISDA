[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risda"
version = "0.3.0"
description = "RISDA training, calibration, inference and evaluation with PPGF and VCLG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch==2.5.1",
  "numpy>=1.26,<2", "pandas>=2.2,<3",
  "xarray>=2024.6,<2026", "h5netcdf>=1.3,<2", "h5py>=3.12,<4",
  "einops>=0.8,<0.9", "omegaconf==2.3.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4,<1", "build>=1,<2"]

[project.scripts]
risda = "risda.run:main"

[tool.setuptools.packages.find]
include = ["appa*", "risda*"]

[tool.setuptools.data-files]
"share/risda" = ["configs/assimilation.yaml", "configs/paths.env.example", "configs/data.yaml", "configs/calibration.yaml"]
"share/risda/training" = ["configs/training/era5_ae.yaml", "configs/training/latent_prior.yaml", "configs/training/satellite_encoder.yaml", "configs/training/convi_encoder.yaml", "configs/training/latents.yaml"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
