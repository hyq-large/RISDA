name: "${.optimizer}_${.learning_rate}_${.scheduler}"
optimizer: "soap"
betas: [0.9, 0.99, 0.99]                 # SOAP uses 1/sqrt(var + eps²); 1e-6 floors early-step spikes (code default = 1e-8)
precondition_frequency: 16
precondition_size: 4096
merge_dims: false
learning_rate: 3e-5
weight_decay: 0.0
warmup: 0
scheduler: "linear"
grad_clip: 1
