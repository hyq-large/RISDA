# AE training on the 0.25° HOURLY ERA5 npy set (ERA5_2016_2025_1h).
defaults:
  - ae: cae_f32_c128
  - optim: soap
channels: 69
data_path: ${oc.env:RISDA_ERA5_1H}
normalization:
  source_mean_path: ${data_path}/mean_std/era5_1h_mean.npy
  source_std_path: ${data_path}/mean_std/era5_1h_std.npy
  target_mean_path: ${data_path}/mean_std/era5_1h_mean.npy
  target_std_path: ${data_path}/mean_std/era5_1h_std.npy
train:
  update_steps: 100000
  # Number of elements that can fit at once on a gpu
  batch_element_per_gpu: 2
  # Effective batch size for one optimizer step
  batch_size_per_step: 64
  precision: float16
  # Minimal number of samples seen to log statistics
  log_interval: 1024
  # Minimal number of samples seen to save checkpoints
  save_interval: 8192
  shuffle_training: true
  trajectory_size: 1
  sub_pressure_levels: false

valid:
  log_interval: 16384
  # Quantitative
  n_valid_samples: 64
  # Qualitative
  n_valid_snapshots: 6

loss:
  error: mse
  latitude_weighting: true
  level_weighting: v1
  l2_weight: 0.
  # VAE KL regularization (only active when ae.vae=true). Disabled by default.
  kl_weight: 0.
  kl_warmup_steps: 0
  N_lat: 720
  N_lon: 1440

slurm_account: null
wandb_entity:  null
