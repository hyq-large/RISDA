model_path: ???  # Set via command line: model_path=<output>/ae/{ae_id}
data_path: ${oc.env:RISDA_ERA5_1H}
dump_name: "era5.h5"

checkpoint: best  # or last

start_date: 2017-01-01
end_date: 2025-12-31
start_hour: 0
end_hour: 23

batch_size: 4
num_chunks: 1

log_every: 10
save_every: 1000

hardware:
  backend: slurm  # or async
  account: users
  latent_chunk:
    cpus: 8
    gpus: 1
    ram: 60GB
    time: "3:00:00"
    partition: gpu
  aggregate:
    cpus: 16
    gpus: 0
    ram: 120GB
    time: "15:00"
    partition: cpu
