defaults:
  - backbone: vit_large
  - optim: adamw

# Latent diffusion on HOURLY 0.25° ERA5 latents (dumped by dump_1h.py from the
# cae_f32c128 AE). The denoiser's spatial shape (H,W,C = 23,47,128) is taken
# automatically from the AE config, so no latent_shape is set here.
#
# Six-frame hourly diffusion training. This experiment uses six adjacent hourly
# latent frames; the fourth frame is restricted to 00/06/12/18 UTC.
# Training runs for 125k updates.
train:
  update_steps: 125_000
  # Number of elements that can fit at once on a gpu
  batch_element_per_gpu: 4
  # Effective batch size for one optimizer step
  batch_size_per_step: 256
  precision: float16
  # Minimal number of samples seen to log statistics
  log_interval: 1024
  # Minimal number of samples seen to save checkpoints
  save_interval: 8192
  shuffle_training: true
  standardize: true
  # Time in hours between two adjacent samples of a blanket
  blanket_dt: 1
  blanket_size: 6
  anchor_frame: 4
  anchor_hour_interval: 6
  noise_schedule: rectified
  sigma_min: 1e-3
  sigma_max: 1e3
  inject_ae_noise: true

loss:
  sigma_min_penalty: 0

valid:
  log_interval: 16384
  # Quantitative
  n_valid_samples: 32
  # Qualitative
  n_valid_dates: 2
  n_valid_samples_per_date: 1
  n_valid_channels: 3
  denoising_steps: 64

# AE run that generated the latents — set via command line: ae_run=xxx
ae_run: ???
# ID of the latent data dump — set via command line: latent_dump=xxx
latent_dump: ???
latent_data: "era5.h5"

slurm_account: null
wandb_entity:  null
