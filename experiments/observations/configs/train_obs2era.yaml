defaults:
  - optim: adamw

# =====================================================================
# Train ATMS-obs -> ERA5-latent inversion encoder (obs2era).
# Reverse of train_e2s: encode real ATMS obs straight to the ERA5 latent,
# decode through the FROZEN ERA5 decoder, masked-MSE vs ERA5 truth on the
# pixels where ATMS observations exist.
# =====================================================================

# --- ERA5 AE (provides the frozen decoder + latent shape) ---
# Must be the dump dir that holds an `ae/` subdir (config.yaml + model.pth).
era_latent_dir: ???  # Pass the trained ERA latent directory.

# --- Data sources ---
data:
  # ERA5 ground-truth npy (normalized; same space the decoder outputs).
  era_data_path: ${oc.env:RISDA_ERA5_6H}
  # Use 1 with hourly arrays and specify all four normalization paths to
  # supervise in the same normalization basis as the frozen ERA decoder.
  era_cadence_hours: 6
  era_normalization: null
  # Real ATMS observation .nc + standardization stats.
  sate_data_path: ${oc.env:RISDA_OBS_ROOT}
  # Supported instruments (TB channels): atms=22, amsua=15, mhs=5, mwhs=15,
  # mwts=17. Just set sate_name; channel count + paths auto-derive. mean/std
  # files (mean_<inst>.npy / std_<inst>.npy) live in the shared sate_standard_dir.
  sate_name: atms
  sate_standard_dir: ${oc.env:RISDA_MEAN_STD}
  # When true, append a cos(satellite-zenith-angle) channel after the mask, so the
  # obs2era encoder input becomes [<TB> | mask | cos_satzen].
  # o2e keeps the mask channel (unlike the sate AE line), so satzen is a pure
  # extra geometry input — no channel is dropped. Set false to drop it.
  # Zenith source per instrument (auto, see SatelliteAEDataset): atms/amsua/mhs
  # use the native satzen channel; mwhs/mwts have no satzen, so Earth_Incidence
  # (the physical zenith-angle equivalent) is used instead.
  # Changing this REQUIRES retraining (input conv shape changes).
  use_satzen: true

# --- Output ---
output_dir: ${oc.env:RISDA_OUTPUT_ROOT}

# --- Model (new ATMS encoder; single-branch ConvEncoder) ---
# resize=32 = 2**5 requires 6 stages (len(hid_blocks)); stage i>0 halves the
# spatial dims, so the trunk downsamples 720x1440 -> 23x47 exactly as the ERA
# ConvEncoder does. Widths are smaller than the 341M official ERA AE to keep the
# encoder light (the heavy 341M decoder stays frozen).
model:
  hid_channels: [64, 128, 192, 256, 384, 512]   # len = 6 stages (5 downsamples)
  hid_blocks:   [2, 2, 2, 2, 2, 2]
  kernel_size: 3
  ffn_factor: 1
  dropout: 0.0
  pixel_shuffle: true
  checkpointing: true              # encoder grad-checkpointing (decode is heavy)
  identity_init: true

# --- Loss ---
# The base supervision is a PHYSICAL-space masked field loss: decode the
# predicted latent through the frozen ERA decoder and MSE it against the ERA5
# truth, masked to the ATMS obs swath (broadcast over 69 channels).
#
# Optionally add a LATENT-space masked-L2 term: compare the predicted latent
# directly to the ground-truth ERA latent (obtained by encoding the ERA5 GT
# field through the SAME frozen ERA AE), masked to the obs-swath pixels
# downsampled onto the 23x47 latent grid. This gives a more direct gradient on
# the latent than the through-the-decoder physical loss.
#   total = physical_weight * L_physical + latent_weight * L_latent
loss:
  physical_weight: 1.0     # weight on the physical-space masked field loss
  latent_weight: 0.0       # weight on the latent-space masked L2 (0.0 => OFF, current behaviour)
  latent_mask_frac: 0.0    # obs-fraction threshold for the latent mask (0.0 => any-observed block; matches reanalysis)
  latent_standardize: false  # if true, standardize both latents by the dump's stats.pth (mean/std) before L2 so all 128 channels weigh equally; needs era_latent_dir/stats.pth

# --- Train ---
# The frozen ERA decoder is 341M params and decodes to 69x720x1440, so the
# decode activations dominate memory: keep batch_size small and use grad-accum.
train:
  update_steps: 100000
  batch_size: 1                    # per-rank micro-batch (decode is memory-heavy)
  batch_size_per_step: 8           # global effective batch (grad-accum fills in)
  num_workers: 4
  precision: float16
  # Validation is hard-coded to 2025-01-01 through 2025-03-31.
  log_interval: 50
  valid_interval: 1000
  save_interval: 2000

slurm_account: null
wandb_entity: null
