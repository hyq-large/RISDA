era_latent_dir: ${oc.env:RISDA_LATENT_DIR}
data:
  sate_data_path: ${oc.env:RISDA_OBS_ROOT}
  sate_name: atms
  sate_standard_dir: ${oc.env:RISDA_MEAN_STD}
  use_satzen: true
  era5:
    directory: ${oc.env:RISDA_DATA_ROOT}/era5_hourly
    coordinate: normalized
    mean: ${oc.env:RISDA_DATA_ROOT}/era5_hourly/mean_std/era5_1h_mean.npy
    std: ${oc.env:RISDA_DATA_ROOT}/era5_hourly/mean_std/era5_1h_std.npy
    grid_shape:
    - 720
    - 1440
  target_mean: ${oc.env:RISDA_MEAN_STD}/mean_era5.npy
  target_std: ${oc.env:RISDA_MEAN_STD}/std_era5.npy
output_dir: ${oc.env:RISDA_MODEL_ROOT}/encoders/${data.sate_name}
model:
  hid_channels:
  - 64
  - 128
  - 192
  - 256
  - 384
  - 512
  hid_blocks:
  - 2
  - 2
  - 2
  - 2
  - 2
  - 2
  kernel_size: 3
  ffn_factor: 1
  dropout: 0.0
  pixel_shuffle: true
  checkpointing: true
  identity_init: true
loss:
  physical_weight: 1.0
  latent_weight: 0.0
train:
  update_steps: 100000
  microbatch: 1
  batch_size_per_step: 8
  num_workers: 4
  precision: float16
  log_interval: 50
  save_interval: 2000
  valid_interval: 1000
  validation_samples: null
optim:
  optimizer: adamw
  betas:
  - 0.9
  - 0.99
  learning_rate: 3.0e-05
  weight_decay: 0.0
  warmup: 0
  scheduler: linear
  grad_clip: 1
  eps: 1.0e-08
seed: 0
dates:
  training:
  - 2017-01-01T00
  - 2024-12-31T23
  validation:
  - 2025-01-01T00
  - 2025-03-31T23
