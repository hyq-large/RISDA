prior:
  model_dir: ${oc.env:RISDA_DENOISER_DIR}
  latent_dir: ${oc.env:RISDA_LATENT_DIR}
  checkpoint: best
sources: [atms, amsua, mhs, mwts, mwhs, convi]
encoders:
  atms: {model_dir: "${oc.env:RISDA_MODEL_ROOT}/encoders/atms", checkpoint: best}
  amsua: {model_dir: "${oc.env:RISDA_MODEL_ROOT}/encoders/amsua", checkpoint: best}
  mhs: {model_dir: "${oc.env:RISDA_MODEL_ROOT}/encoders/mhs", checkpoint: best}
  mwts: {model_dir: "${oc.env:RISDA_MODEL_ROOT}/encoders/mwts", checkpoint: best}
  mwhs: {model_dir: "${oc.env:RISDA_MODEL_ROOT}/encoders/mwhs", checkpoint: best}
  convi: {model_dir: "${oc.env:RISDA_MODEL_ROOT}/encoders/convi", checkpoint: best}
data:
  observations: ${oc.env:RISDA_OBS_ROOT}
  normalization: ${oc.env:RISDA_MEAN_STD}
  surf_dir: ${oc.env:RISDA_OBS_ROOT}/convi/surf_qc
  icoa_dir: ${oc.env:RISDA_OBS_ROOT}/convi/icoads_qc
uncertainty:
  variance: ${oc.env:RISDA_VARIANCE}
  reliability: ${oc.env:RISDA_RELIABILITY}
  var_y_scale: 1.0
  variance_floor: 1.0e-8
timeline:
  start: "2025-04-01T00"
  end: "2025-06-30T18"
  step_hours: 6
sampling:
  steps: 64
  solver_iterations: 2
  corrections: 2
  delta: 0.1
seed: 0
precision: float16
save_decoded: true
output_root: ${oc.env:RISDA_OUTPUT_ROOT}/runs
